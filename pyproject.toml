[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "statespace-toolkit"
version = "0.1.0.dev0"
description = "Bayesian state space models: the Python version of statespace-toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua C. C. Chan" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.12",
    "matplotlib>=3.7",
]
keywords = ["state space models", "precision sampler", "stochastic volatility",
            "unobserved components", "Bayesian econometrics", "MCMC"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/joshuaccchan/statespace-toolkit-python"
"MATLAB version" = "https://github.com/joshuaccchan/statespace-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
